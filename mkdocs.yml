site_name: duq
site_description: Dimensions, units, and quantities for scientific computing — with unit-carrying NumPy and JAX arrays.
site_author: Armin Ariamajd
repo_url: https://github.com/AAriam/duq
repo_name: AAriam/duq
copyright: Copyright &copy; Armin Ariamajd — MIT License

docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.highlight

nav:
  - Home: index.md
  - Learn:
      - Quickstart: learn/quickstart.md
      - Units & dimensions: learn/units-and-dimensions.md
      - Quantities: learn/quantities.md
      - NumPy arrays: learn/numpy-arrays.md
      - JAX: learn/jax.md
      - Dimensional analysis: learn/dimensional-analysis.md
      - Constants: learn/constants.md
      - Unit catalog: learn/unit-catalog.md
  - API reference:
      - Core (duq): api/core.md
      - duq.analysis: api/analysis.md
      - duq.constants: api/constants.md
      - duq.jax: api/jax.md
      - duq.jax.numpy: api/jax-numpy.md
  - Development:
      - Design: dev/design.md
      - Research report: dev/research_numpy_jax_units.md
      - JAX primitive coverage: dev/jax_coverage.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: true
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
