[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata (PEP 621 / PEP 639)
# ---------------------------------------------------------------------------
[project]
name = "duq"
version = "1.0.0.dev0"
description = "Dimensions, units, and quantities for scientific computing — with unit-carrying NumPy and JAX arrays."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Armin Ariamajd", email = "armin.ariamajd@gmail.com" }]
keywords = [
    "units",
    "dimensional-analysis",
    "physical-quantities",
    "unit-conversion",
    "numpy",
    "jax",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# quax is single-maintainer and on the 0.3.x line (research report Risk #4), so
# it is pinned with an upper bound; equinox provides the Module/pytree base quax
# builds on.
jax = ["jax>=0.5", "quax>=0.3.6,<0.5", "equinox>=0.11"]

[project.urls]
Repository = "https://github.com/AAriam/duq"
Issues = "https://github.com/AAriam/duq/issues"

# ---------------------------------------------------------------------------
# Build backend (hatchling, src layout)
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/duq"]

# ---------------------------------------------------------------------------
# Pixi workspace (https://pixi.sh) — manages dev/test/CI environments
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

# Runtime (default) environment: the package plus its runtime dependencies.
[tool.pixi.dependencies]
python = ">=3.11"
numpy = ">=1.26"

# Install the project itself as an editable install into every environment
# that includes the default feature.
[tool.pixi.pypi-dependencies]
duq = { path = ".", editable = true }

# --- Features --------------------------------------------------------------
[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
hypothesis = "*"

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", default-environment = "test" }
test-cov = { cmd = "pytest --cov=duq --cov-report=term-missing --cov-report=xml", default-environment = "test" }

[tool.pixi.feature.lint.dependencies]
ruff = "*"
pre-commit = "*"

[tool.pixi.feature.lint.tasks]
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."

# The type feature includes the JAX stack so mypy --strict can check
# src/duq/jax and tests/jax; conda-forge ships no win-64 jax, hence the
# platform restriction (CI type-checks on ubuntu).
[tool.pixi.feature.type]
platforms = ["osx-64", "osx-arm64", "linux-64"]

[tool.pixi.feature.type.dependencies]
mypy = "*"
numpy = ">=1.26"
jax = ">=0.5"
equinox = ">=0.11"
# Present so mypy can resolve the (typed) test-suite imports under --strict.
pytest = "*"
hypothesis = "*"
packaging = "*"

[tool.pixi.feature.type.pypi-dependencies]
quax = ">=0.3.6,<0.5"

[tool.pixi.feature.type.tasks]
typecheck = "mypy"

# JAX is restricted to platforms where conda-forge ships it (no win-64).
[tool.pixi.feature.jax]
platforms = ["osx-64", "osx-arm64", "linux-64"]

[tool.pixi.feature.jax.dependencies]
jax = ">=0.5"
# equinox is on conda-forge; quax is not, so it is added below as a PyPI dep.
equinox = ">=0.11"

[tool.pixi.feature.jax.pypi-dependencies]
# quax is not packaged on conda-forge, so it comes from PyPI; the upper bound
# mirrors the pyproject [project.optional-dependencies] jax pin.
quax = ">=0.3.6,<0.5"

[tool.pixi.feature.jax.tasks]
# The global coverage gate (95%) omits duq/jax (unimportable without jax);
# this task runs the whole suite with jax installed and enforces a dedicated
# >=90% gate on src/duq/jax via its own coverage config.
test-jax = { cmd = "pytest --cov --cov-config=coverage-jax.toml", default-environment = "test-jax" }

# NumPy 1.26 pin: guards the NEP-13/18 behaviour differences (and the
# trapz/trapezoid rename) between NumPy 1.26 and 2.x on the minimum Python.
[tool.pixi.feature.np126.dependencies]
python = "3.11.*"
numpy = "1.26.*"

# Python-version pin features for the test matrix.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# --- Environments ----------------------------------------------------------
[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
test-jax = { features = ["test", "jax"] }
lint = { features = ["lint"], no-default-feature = true }
# Type-check against the minimum supported Python (matches mypy's python_version).
type = { features = ["type", "py311"], no-default-feature = true }
test-np126 = { features = ["test", "np126"] }
test-py311 = { features = ["test", "py311"] }
test-py312 = { features = ["test", "py312"] }
test-py313 = { features = ["test", "py313"] }
test-py314 = { features = ["test", "py314"] }

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PL"]
# The NumPy back-end is imported lazily throughout these two modules (inside the
# array hooks and array helpers) so that the pure core never imports NumPy;
# PLC0415 (import-not-at-top-level) is the intended pattern here, not a smell.
"src/duq/_quantity.py" = ["PLC0415"]
"src/duq/_unit.py" = ["PLC0415"]
# The __array_function__ handlers branch on NumPy positional-argument counts
# (``len(args) > 2`` etc.); those small integers are argument positions, not
# magic domain constants, so PLR2004 is noise here.
"src/duq/_numpy/_functions.py" = ["PLR2004"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/duq", "tests"]
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["duq"]
branch = true
# duq/jax cannot import (or be measured) without the optional jax stack; the
# test-jax task gates it separately at >=90% via coverage-jax.toml.
omit = ["*/duq/jax/*"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
