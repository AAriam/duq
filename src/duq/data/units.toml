# Unit catalogue for duq.
#
# Every atom carries:
#   symbol       display symbol (as entered / rendered)
#   name         human-readable name
#   aliases      alternative spellings accepted by the parser (optional)
#   dimension    named dimension from dimensions.toml  -- OR --
#   exponents    explicit base-dimension exponent mapping
#   scale        factor to the coherent SI unit, as a string
#   exact        true  -> scale is parsed to an exact Fraction
#                false -> scale is parsed to a float (measured / irrational)
#   offset       additive offset to coherent SI (affine units only; default "0")
#   prefixable   whether SI prefixes may be attached
#   kind         "linear" (default), "affine" or "delta"
#
# Exact scales derived from post-2019 SI definitions (eV, e) use the exact
# 2019 defining constants.  Measured atoms (Da, m_e, bohr, hartree) use CODATA
# 2022 values and are therefore flagged exact = false.

# --- SI base units ---------------------------------------------------------

[units.second]
symbol = "s"
name = "second"
dimension = "time"
scale = "1"
exact = true
prefixable = true

