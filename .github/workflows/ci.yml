name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.0
          environments: lint
          cache: true
      - name: Ruff lint
        run: pixi run -e lint lint
      - name: Ruff format check
        run: pixi run -e lint fmt-check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.0
          environments: type
          cache: true
      - name: mypy
        run: pixi run -e type typecheck

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        environment: [test-py311, test-py313]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.0
          environments: ${{ matrix.environment }}
          cache: true
      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test

  test-jax:
    name: Test with JAX (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.0
          environments: test-jax
          cache: true
      - name: Run tests with JAX installed
        run: pixi run -e test-jax test
